name: UI Review APK

on:
  push:
    branches:
      - ui/live-core-mock-v1

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event.head_commit.message == 'Build UI review APK'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KEIBA-MOBILE-UI-REVIEW.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KEIBA-MOBILE-UI-REVIEW
          path: KEIBA-MOBILE-UI-REVIEW.apk
          retention-days: 1
          if-no-files-found: error
