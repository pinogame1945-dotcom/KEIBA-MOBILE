name: Build standalone release APK

on:
  push:
    branches:
      - apk-build-trigger
    paths:
      - .github/apk-build-request.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve target build identity
        id: target
        run: |
          echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone arm64 release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "KEIBA-MOBILE-APK-${{ github.run_number }}-${{ steps.target.outputs.short_sha }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KEIBA-MOBILE-APK-${{ github.run_number }}-${{ steps.target.outputs.short_sha }}
          path: KEIBA-MOBILE-APK-${{ github.run_number }}-${{ steps.target.outputs.short_sha }}.apk
          retention-days: 1
          if-no-files-found: error
