name: Build standalone release APK

on:
  push:
    branches:
      - feat/real-app-ui-v1
      - main
    paths:
      - .github/apk-build-request.txt

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone arm64 release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KEIBA-MOBILE-REAL-APP.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KEIBA-MOBILE-REAL-APP
          path: KEIBA-MOBILE-REAL-APP.apk
          retention-days: 1
          if-no-files-found: error
